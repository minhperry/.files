[module/date]
type = internal/date
interval = 1

date = %H:%M:%S
date-alt = %d.%m.%Y %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

; click-right = notifiy-send h

[module/calendar]
type = custom/script
exec = /home/$USER/.config/polybar/script/calendar.sh
interval = 5
click-left = /home/$USER/.config/polybar/script/calendar.sh --popup &
