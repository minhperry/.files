include-file = colors.ini

[bar/tokyo]
width = 100%
height = 22pt
radius = 4

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = monospace:size=10;2
font-1 = "MesloLGS Nerd Font:size=11;2"

; dim-value = 0.5
locale = de_DE.UTF-8

# ========= Main Layout =========
modules-left = xwindow
modules-center = date
modules-right = keystatus xkeyboard audio cpu memory wlan battery power

;cursor-click = pointer
;cursor-scroll = ns-resize

enable-ipc = true

wm-restack = generic
;wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

monitor = ${env:MONITOR:}

# include-file = ./modules/base-network.ini
include-directory = modules 
