capsule_fill = "#30364D"

[widget.privacy]
enabled = false

[widget.ram]
display = "text"

[widget.session]
capsule = true
capsule_fill = "#3B2D3D"
color = "#F7768E"

[widget.taskbar]
enabled = false

[widget.temp]
display = "text"

[widget.tray]
capsule = true
capsule_fill = "#30364D"
