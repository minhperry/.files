config_version = 8

[bar]
order = [ "waybar-repl" ]

    [bar.waybar-repl]
    end = [ "group:g2", "tray", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
    margin_ends = 0
    padding = 8
    panel_overlap = 0
    radius = 0
    shadow = false
    start = [ "notifications", "workspaces", "group:g1", "taskbar", "bar" ]

        [[bar.waybar-repl.capsule_group]]
        enabled = true
        fill = "#30364D"
        id = "g1"
        members = [ "cpu", "ram", "temp" ]
        opacity = 1.0
        padding = 6.0

        [[bar.waybar-repl.capsule_group]]
        enabled = true
        fill = "#30364D"
        id = "g2"
        members = [ "network_tx", "network_rx" ]
        opacity = 1.0
        padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 20

[brightness]
minimum_brightness = 0.0099999997764825821

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[desktop_widgets]
schema_version = 2
widget_order = [
    "desktop-widget-0000000000000001",
    "desktop-widget-0000000000000002",
    "desktop-widget-0000000000000003",
    "desktop-widget-0000000000000004"
]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 96.0
    box_width = 272.0
    cx = 168.0
    cy = 108.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background_color = "surface"
        background_opacity = 0.83000000000000007
        background_radius = 12
        center_text = true
        clock_style = "digital"
        color = "on_surface"
        font_family = ""
        format = "{:%A, %d.%m.%y}\\n{:%H:%M:%S}"
        shadow = false
        timezone = "Europe/Berlin"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 96.0
    box_width = 1536.0
    cx = 1120.0
    cy = 108.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        bands = 128
        centered = false
        color_1 = "#5754F7"
        color_2 = "#FB5667"
        mirrored = true
        show_when_idle = true

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 336.0
    box_width = 528.0
    cx = 296.0
    cy = 372.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        background = true
        stat = "cpu_usage"
        stat2 = "ram_pct"

    [desktop_widgets.widget.desktop-widget-0000000000000004]
    box_height = 480.0
    box_width = 448.0
    cx = 1664.0
    cy = 444.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000004.settings]
        forecast_days = 6
        show_forecast = true

[dock]
position = "top"
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
address = "Dortmund, Germany"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 881.5
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 881.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification.filter.abrt_applet]
match = "abrt-applet"
show_toast = false

[notification.filter.kitty]
match = "kitty"
override_duration = 2000

[osd]
background_opacity = 0.99999997764825821

    [osd.kinds]
    media = false

[plugins]
enabled = [ "kenn/keybind-cheatsheet", "radimous/prismlauncher-instances" ]

[shell]
lang = "en"
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.launcher]
    provider_prefix = "!"

        [shell.launcher.providers.calculator]
        prefix = ""

        [shell.launcher.providers.session]
        prefix = "ses"

        [shell.launcher.providers.wallpaper]
        prefix = "wp"

    [shell.panel]
    clipboard_placement = "attached"
    shadow = false

    [shell.screenshot]
    confirm_region = true
    directory = "/home/minh/Pictures/Screenshot"
    show_cursor = true

    [shell.session]
    show_shortcuts = false

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Storm"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
directory = "/home/minh/Pictures/Screensaver"
enabled = false

    [wallpaper.default]
    path = "/home/minh/Pictures/Screensaver/shiolie.jpg"

    [wallpaper.last]
    path = "/home/minh/Pictures/Screensaver/shiolie.jpg"

    [wallpaper.monitor.HDMI-A-1]
    fill_color = "secondary"

    [wallpaper.monitor.eDP-1]
    fill_color = "primary"

[widget.audio_visualizer]
bands = 127
width = 400

[widget.bar]
capsule = true
capsule_fill = "#30364D"
type = "icefish/phone-connect:bar"

[widget.battery]
capsule = true
capsule_fill = "#30364D"
hide_when_full = true
hide_when_plugged = true

[widget.bluetooth]
capsule = true
capsule_fill = "#30364D"

[widget.brightness]
capsule = true
capsule_fill = "#30364D"

[widget.clipboard]
enabled = false

[widget.clock]
format = "{:%a %d %b}, {:%H:%M:%S}"

[widget.control-center]
enabled = false

[widget.cpu]
display = "text"

[widget.launcher]
enabled = false

[widget.lock_keys]
enabled = false

[widget.media]
enabled = false

[widget.network]
